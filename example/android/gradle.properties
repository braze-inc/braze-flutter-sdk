org.gradle.jvmargs=-Xmx8g
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=false
# AGP 9.2 R8 optimized resource shrinking rejects final resource IDs.
android.nonFinalResIds=true
# AGP 9 only registers unit tests for the tested build type (debug).
# develop and master still run :braze_plugin:testReleaseUnitTest.
android.onlyEnableUnitTestForTheTestedBuildType=false
# AGP 9. Keep the Groovy DSL these build files already use.
android.newDsl=false
# AGP 9.2.1's built-in Kotlin is 2.2.10. Flutter 3.47 rejects that as below its
# 2.2.20 floor, so this sample stays on the opt-out and lets Flutter apply KGP.
# The plugin itself does not apply KGP, which is what host apps need in order
# to turn this flag on once Flutter and AGP agree on a Kotlin version.
android.builtInKotlin=false
